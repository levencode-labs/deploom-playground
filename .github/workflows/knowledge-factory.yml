name: Knowledge factory contracts
on:
  pull_request:
    paths:
      - 'knowledge-factory/**'
      - '.github/workflows/knowledge-factory.yml'
  push:
    branches: [main]
    paths:
      - 'knowledge-factory/**'
      - '.github/workflows/knowledge-factory.yml'
  workflow_dispatch:
    inputs:
      paid_execute:
        description: 'Explicitly allow billable OpenAI Agent sessions'
        type: boolean
        default: false
      max_sessions:
        description: 'Paid sessions requested (each has an independent $2 API spend control)'
        type: choice
        options: ['1', '2', '4', '8', '16', '32', '64', '80']
        default: '8'
      workers:
        description: 'Concurrent hosted sessions (not counting optional subagents)'
        type: choice
        options: ['1', '2', '4', '8']
        default: '4'
      lane:
        description: 'Balanced across eight dependency ecosystems, or one specific stack'
        type: choice
        options: ['balanced', 'pilot', 'next-react', 'vite-build', 'vue-nuxt', 'typescript-eslint', 'testing', 'ui-tailwind', 'monorepo', 'library-upstream']
        default: 'balanced'
permissions:
  contents: read
jobs:
  contracts:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Verify signed-byte GitLab mirror with offline fixtures
        run: node --test knowledge-factory/tests/mirror-v2.test.mjs
      - name: Offline corpus and budget regression tests
        run: |
          python -m unittest discover -s knowledge-factory/tests -v
          python knowledge-factory/research/validate_catalog.py > "$RUNNER_TEMP/catalog-report.json"
          python knowledge-factory/research/prepare_batches.py --output-dir "$RUNNER_TEMP/source-exact-batches"
          python knowledge-factory/research/combine_batches.py --out "$RUNNER_TEMP/balanced.json"
          python knowledge-factory/parallel_batch.py plan --corpus "$RUNNER_TEMP/balanced.json" --max-sessions 8 --workers 4 --budget-usd 16 --reserve-usd 2 > "$RUNNER_TEMP/parallel-plan.json"
          python -m json.tool "$RUNNER_TEMP/catalog-report.json" > /dev/null
          python -m json.tool "$RUNNER_TEMP/parallel-plan.json" > /dev/null
      - uses: actions/upload-artifact@v4
        with:
          name: knowledge-factory-plan
          path: |
            ${{ runner.temp }}/parallel-plan.json
            ${{ runner.temp }}/catalog-report.json
          if-no-files-found: error
  paid-pilot:
    if: github.event_name == 'workflow_dispatch' && inputs.paid_execute == true
    needs: contracts
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    concurrency:
      group: deploom-collective-knowledge-paid
      cancel-in-progress: false
    environment: knowledge-lab-paid
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Manually authorized API sessions; no public publication
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          COUNT: ${{ inputs.max_sessions }}
          WORKERS: ${{ inputs.workers }}
          LANE: ${{ inputs.lane }}
        run: |
          set -euo pipefail
          test -n "$OPENAI_API_KEY"
          case "$LANE" in
            pilot)
              CORPUS=knowledge-factory/corpus/projects.lock.json ;;
            balanced)
              python knowledge-factory/research/combine_batches.py --out "$RUNNER_TEMP/balanced.json"
              CORPUS="$RUNNER_TEMP/balanced.json" ;;
            next-react|vite-build|vue-nuxt|typescript-eslint|testing|ui-tailwind|monorepo|library-upstream)
              python knowledge-factory/research/prepare_batches.py --output-dir "$RUNNER_TEMP/source-exact-batches"
              CORPUS="$RUNNER_TEMP/source-exact-batches/research-$LANE.json" ;;
            *) echo "Unapproved source lane" >&2; exit 2 ;;
          esac
          python knowledge-factory/parallel_batch.py run --execute --corpus "$CORPUS" --max-sessions "$COUNT" --workers "$WORKERS" --budget-usd "$((COUNT*2))" --reserve-usd 2
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: knowledge-factory-receipts
          path: knowledge-factory/.runs/**/*
          if-no-files-found: warn
