<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <title>План обновления · DepLoom</title>
  <link rel="stylesheet" href="lab.css">
  <link rel="stylesheet" href="package-picker.css">
</head>
<body>
  <header data-nav></header>
  <main>
    <h1 data-en="Upgrade plan">План обновления</h1>
    <section class="panel plan-input" aria-label="Цель обновления" id="plan-form">
      <div class="plan-action-row">
        <label for="plan-mode" id="plan-goal-label" data-en="Freshness goal for direct dependencies">Цель по свежести прямых зависимостей</label>
        <select id="plan-mode">
          <option value="yellow">Yellow · 80%</option>
          <option value="green">Green · 100%</option>
          <option value="manual" data-en="Specific packages">По пакетам</option>
        </select>
        <button type="button" class="button" id="make-plan" disabled data-en="Calculate">Рассчитать</button>
      </div>
      <div id="manual-goal" hidden>
        <div class="grid">
          <label class="field"><span data-en="Package to update">Пакет для обновления</span><input id="goal-package" type="text" autocomplete="off" spellcheck="false"></label>
          <label class="field"><span data-en="Target version">Целевая версия</span><input id="goal-version" type="text" placeholder="1.2.3" spellcheck="false"></label>
        </div>
      </div>
      <p class="hint" id="project" role="status"></p>
      <div id="plan-options" hidden></div>
      <div id="manual-options" hidden>
        <details id="batch-goals"><summary data-en="Set several targets in JSON">Несколько целей в JSON</summary>
          <textarea id="targets" aria-label="JSON" rows="3" spellcheck="false">{}</textarea></details>
        <details id="local-metadata"><summary data-en="Load package manifests for an offline check">Манифесты библиотек для офлайн-проверки</summary>
          <label class="field"><span data-en="package.json for a target release or installed direct dependency">package.json целевой версии или установленной прямой зависимости</span><input type="file" multiple id="meta-files" accept=".json,application/json"></label></details>
      </div>
    </section>
    <p id="plan-status" role="status"></p>
    <section class="panel" id="plan-output" hidden></section>
    <details class="panel" id="network" hidden>
      <summary data-en="Look up missing requirements">Уточнить недостающие требования</summary>
      <p class="hint" id="send-host"></p>
      <div id="lookup-packages"></div>
      <button type="button" id="lookup" data-en="Look up selected releases">Запросить выбранные версии</button>
      <p id="net-status" role="status"></p>
    </details>
  </main>
  <script src="nav.js?v=6528feb95534"></script>
  <script src="vendor/semver.js"></script>
  <script src="lock-graph.js"></script>
<script src="vendor/yarn-classic.js"></script>
<script src="vendor/js-yaml.min.js"></script>
<script src="yarn-lock.js"></script>
<script src="drop-files.js" defer></script>
  <script src="plan-model.js"></script>
  <script src="webpack-data.js"></script>
  <script src="selector-data.js"></script>
  <script src="review-example.js"></script>
  <script src="registry.js"></script>
  <script src="criterion.js"></script>
  <script src="webpack-releases.js"></script>
  <script src="package-combo.js"></script>
  <script src="package-picker.js"></script>
  <script src="plan-handoff.js"></script>
  <script src="criterion-plan.js"></script>
  <script src="plan.js"></script>
</body>
</html>
