<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <title>Аудит пакета · DepLoom</title>
  <link rel="stylesheet" href="lab.css"><link rel="stylesheet" href="report.css">
</head>
<body>
  <header data-nav></header>
  <main class="audit-page">
    <h1 id="audit-title" data-en="Dependency audit">Аудит зависимостей</h1>
    <nav class="audit-modes" aria-labelledby="audit-title">
      <a href="audit.html" data-en="Project">Проект</a>
      <a href="advisories.html" aria-current="page" data-en="Package">Пакет</a>
    </nav>
    <section class="panel audit-form">
      <form id="advisory-form">
        <div class="audit-package-form">
          <div><label for="package" data-en="npm package">Пакет npm</label>
            <input id="package" type="text" required maxlength="214" placeholder="react-dom" autocomplete="off" autocapitalize="none" spellcheck="false"></div>
          <div><label for="version" data-en="Exact version">Точная версия</label>
            <input id="version" type="text" required maxlength="256" placeholder="19.0.0" autocomplete="off" autocapitalize="none" spellcheck="false"></div>
          <button class="button" type="submit" id="query-button" disabled data-en="Run audit">Выполнить</button>
        </div>
        <p id="scope-confirmation" hidden><label><input id="public-scope" type="checkbox">
          <span data-en="Allow this name to be sent to public OSV.">Разрешаю отправить это имя в публичную базу OSV.</span></label></p>
        <p id="destination" class="hint"></p>
        <small id="project-note" class="hint" role="status"></small>
      </form>
    </section>
    <section id="package-result" class="panel audit-result" hidden aria-labelledby="package-result-title">
      <h2 id="package-result-title" data-en="Audit results">Результат аудита</h2>
      <p id="query-status" role="status"></p>
      <ul id="advisories" class="report-list"></ul>
    </section>
  </main>
  <script src="nav.js?v=6528feb95534"></script>
  <script src="vendor/semver.js"></script><script src="lock-graph.js"></script>
  <script src="vendor/yarn-classic.js"></script><script src="vendor/js-yaml.min.js"></script><script src="yarn-lock.js"></script>
  <script src="registry.js"></script><script src="audit-model.js"></script>
  <script src="severity.js"></script><script src="selector-data.js"></script><script src="hosted-audit.js"></script><script src="audit-capture.js"></script><script src="package-combo.js"></script><script src="finding-cards.js"></script><script src="advisories.js"></script>
</body>
</html>
